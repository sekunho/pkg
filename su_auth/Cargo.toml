[package]
name = "su_auth"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
su_sqlite.workspace = true
deadpool-sqlite.workspace = true

axum-core = "0.5"
http = "1"
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }

tokio = { workspace = true, features = ["rt"] }

sha2 = "0.11"
base64 = "0.23"

rusqlite = { version = "0.40", features = ["time"] }
time.workspace = true
argon2 = "0.6"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
