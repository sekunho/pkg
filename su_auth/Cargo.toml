[package]
name = "su_auth"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# Web
axum-core = "0.5"
http = { version = "1", default-features = false, features = [] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }

tokio = { version = "1.53", default-features = false, features = ["rt"] }

# Encoding stuff
sha2 = "0.11"
base64 = { version = "0.23", default-features = false, features = ["std"] }
argon2 = { version = "0.6", default-features = false, features = ["password-hash", "getrandom", "alloc"], optional = true }

time = { version = "0.3", default-features = false }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }

# DB
rusqlite = { version = "0.40", default-features = false, features = [], optional = true }

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt"] }

[lints]
workspace = true

[features]
rusqlite = ["dep:rusqlite"]
argon2 = ["dep:argon2"]
verification-code = []
