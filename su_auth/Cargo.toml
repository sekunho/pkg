[package]
name = "su_auth"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.91"
version.workspace = true

[dependencies]
# Web
axum-core = "0.5"
http = { version = "1", default-features = false, features = [] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie"], optional = true }
tower-layer = { version = "0.3", default-features = false, features = [], optional = true }
tower-service = { version = "0.3", default-features = false, features = [], optional = true }

tokio = { version = "1.53", default-features = false, features = ["rt", "sync", "time"] }

# Encoding stuff
sha2 = "0.11"
base64 = { version = "0.23", default-features = false, features = ["std"] }
argon2 = { version = "0.6", default-features = false, features = ["password-hash", "getrandom", "alloc"], optional = true }

time = { version = "0.3", default-features = false, optional = true }

# Observability stuff
tracing = { version = "0.1", default-features = false, features = []}

# DB
rusqlite = { version = "0.40", default-features = false, features = [], optional = true }

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt", "macros", "time"] }

[lints]
workspace = true

[features]
default = ["middleware", "cookie"]
rusqlite = ["dep:rusqlite"]
argon2 = ["dep:argon2"]
verification-code = []
middleware = ["cookie", "dep:tower-layer", "dep:tower-service"]
cookie = ["dep:axum-extra", "dep:time"]
